name: Verify Atlas
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate offline app and privacy
        run: node --test tests/*.test.mjs
      - name: Verify static deploy assets
        shell: bash
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f reference.js
          test -f experience.js
          test -f experience.css
          test -f sw.js
          test -f manifest.webmanifest
          test -f assets/icon.svg
          test -f assets/icon-apple.png
